<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAMSHIELD AI | Create Account</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:#05080d;color:#eaf7ff;display:flex;align-items:center;justify-content:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(0,220,255,.11),transparent 34%),linear-gradient(135deg,#05080d,#07111a 55%,#04070b);z-index:-2}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,210,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,.035) 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);z-index:-1}
.card{width:min(460px,92vw);padding:38px;border:1px solid rgba(0,225,255,.22);border-radius:24px;background:rgba(8,16,24,.82);backdrop-filter:blur(18px);box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 45px rgba(0,210,255,.06)}
.brand{text-align:center;margin-bottom:28px}.brand h1{font-size:27px;letter-spacing:3px;color:#fff}.brand h1 span{color:#20dfff}.brand p{margin-top:7px;color:#7f9aaa;font-size:13px;letter-spacing:.8px}
.title{font-size:22px;margin-bottom:5px}.subtitle{font-size:13px;color:#78909e;margin-bottom:24px}
label{display:block;font-size:12px;color:#9bb1bd;margin:0 0 8px 2px} .field{margin-bottom:17px}
input{width:100%;height:48px;padding:0 15px;border-radius:12px;border:1px solid #203643;background:#071019;color:#ecfbff;outline:none;transition:.2s;font-size:14px}input:focus{border-color:#18d9ff;box-shadow:0 0 0 3px rgba(24,217,255,.09)}
button{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,#0bc9ed,#168fff);color:#001018;font-weight:800;letter-spacing:.7px;cursor:pointer;box-shadow:0 8px 25px rgba(0,190,255,.18);transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.status{min-height:20px;margin:15px 0 2px;text-align:center;font-size:13px}.error{color:#ff7180}.success{color:#43e6ae}
.bottom{text-align:center;margin-top:22px;color:#708894;font-size:13px}.bottom a{color:#27dcff;text-decoration:none;font-weight:700}.bottom a:hover{text-decoration:underline}
.security{margin-top:25px;padding-top:18px;border-top:1px solid rgba(130,170,190,.12);text-align:center;color:#607985;font-size:11px;letter-spacing:.3px}
@media(max-width:500px){.card{padding:28px 22px}.brand h1{font-size:23px}}
</style>
</head>
<body>
<div class="grid"></div>
<main class="card">
  <div class="brand"><h1>SCAM<span>SHIELD</span> AI</h1><p>AI-POWERED CYBER SECURITY</p></div>
  <h2 class="title">Create your account</h2>
  <p class="subtitle">Register to access your SCAMSHIELD security dashboard.</p>

  <form id="registerForm" novalidate>
    <div class="field"><label for="name">FULL NAME</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required></div>
    <div class="field"><label for="email">EMAIL ADDRESS</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
    <div class="field"><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a strong password" required></div>
    <div class="field"><label for="confirmPassword">CONFIRM PASSWORD</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required></div>
    <button id="registerButton" type="submit">CREATE ACCOUNT</button>
    <div id="status" class="status"></div>
  </form>

  <div class="bottom">Already have an account? <a href="login.html">Login</a></div>
  <div class="security">🔒 Your password is securely hashed before storage.</div>
</main>
<script>
const form=document.getElementById('registerForm');
const statusEl=document.getElementById('status');
const button=document.getElementById('registerButton');
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  statusEl.className='status'; statusEl.textContent='';
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;
  if(!name||!email||!password||!confirmPassword){statusEl.classList.add('error');statusEl.textContent='Please fill in all fields.';return}
  if(password.length<8){statusEl.classList.add('error');statusEl.textContent='Password must be at least 8 characters.';return}
  if(password!==confirmPassword){statusEl.classList.add('error');statusEl.textContent='Passwords do not match.';return}
  button.disabled=true;button.textContent='CREATING ACCOUNT...';
  try{
    const response=await fetch('http://127.0.0.1:5000/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});
    const data=await response.json().catch(()=>({message:'Unexpected server response.'}));
    if(!response.ok){throw new Error(data.message||'Registration failed.')}
    localStorage.setItem('scamshield_user_email',email);
    statusEl.classList.add('success');statusEl.textContent='Account created successfully. Redirecting to login...';
    setTimeout(()=>window.location.href='login.html',900);
  }catch(err){statusEl.classList.add('error');statusEl.textContent=err.message||'Unable to connect to the server.';button.disabled=false;button.textContent='CREATE ACCOUNT'}
});
</script>
</body>
</html>
